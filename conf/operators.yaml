ops:
  - id: parallel_wall_attn
    description: Run Wall-Attention correctness and performance tests on the selected backend.
    for:
      - parallel_wall_attn
    labels:
      - fused
      - Attention
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_parallel_wall_attn.py
    benchmark: benchmark/test_parallel_wall_attn_benchmark.py
  - id: hy3_attention
    description: Run Hy3 FP8 prefill and BF16/FP8 decode, including static and dynamic scheduling. Requires PyTorch 2.7.0.
    for:
      - hy3_attention
      - attention_with_kvcache_blocksparse_prefill_fp8
      - attention_decode_bf16_static
      - attention_decode_bf16_dynamic
      - attention_decode_fp8
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: unreleased
    tests:
      - tests/flag_attn/test_hpc_ops_prefill_fp8.py::test_attention_blocksparse_prefill_fp8_rejects_cpu
      - tests/flag_attn/test_hpc_ops_prefill_fp8.py::test_attention_blocksparse_prefill_fp8
      - tests/flag_attn/test_hpc_ops_decode_bf16.py::test_attn_bf16_sm90
      - tests/flag_attn/test_hpc_ops_decode_qkpertoken_perhead_vperhead_fp8.py::test_attn_fp8_sm90
      - tests/flag_attn/test_hpc_ops_decode_qpertoken_perhead_kvpertensor_fp8.py::test_attn_fp8_sm90
    benchmark:
      - benchmark/test_hpc_ops_prefill_fp8_perf.py
      - benchmark/test_hpc_ops_decode_bf16_perf.py
      - benchmark/test_hpc_ops_decode_fp8_perf.py
  - id: chunk_gated_delta_rule
    description: Run the forward path for chunked gated delta rule attention.
    for:
      - chunk_gated_delta_rule
      - chunk_gated_delta_rule_fwd
    labels:
      - fused
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_fwd_recompute_tle_matches_native
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_fwd_full_tle_matches_native
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_public_api_matches_native
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_fwd_two_kernel_matches_native
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_two_kernel_configs
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_fwd_hybrid_matches_two_kernel
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_hybrid_matches_fla
      - tests/flag_attn/test_gated_delta_rule.py::test_chunk_gated_delta_rule_public_api_uses_two_kernel
    benchmark: benchmark/test_gated_delta_rule_benchmark.py
  - id: chunk_gdn2
    description: Compare native and TLE chunked GDN2 implementations and resource controls.
    for:
      - chunk_gdn2
    labels:
      - fused
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_gdn2.py
      - tests/flag_attn/test_ascend_attention.py::test_gdn2_recurrence
      - tests/flag_attn/test_ascend_attention.py::test_gdn2_rejects_unsupported_chunk_size
    benchmark: benchmark/test_gdn2_benchmark.py
  - id: chunk_gla
    description: Run fixed-length, state-v-first, and variable-length chunked gated linear attention.
    for:
      - chunk_gla
    labels:
      - fused
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_chunk_gla.py::test_chunk
      - tests/flag_attn/test_chunk_gla.py::test_chunk_state_v_first
      - tests/flag_attn/test_chunk_gla.py::test_chunk_varlen
      - tests/flag_attn/test_ascend_attention.py::test_gla_forward
    benchmark: benchmark/test_chunk_gla_benchmark.py
  - id: chunk_kda
    description: Run Kimi Delta Attention inference on the selected backend against its recurrent reference.
    for:
      - chunk_kda
      - chunk_kda_fwd_infer
    labels:
      - fused
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/test_FLA/test_chunk_kda.py
      - tests/flag_attn/test_ascend_attention.py::test_kda_recurrence
    benchmark: benchmark/test_FLA/bench_chunk_kda.py
  - id: chunk_kda_enflame
    description: Run Enflame Kimi Delta Attention accuracy tests and its pytest benchmark.
    for:
      - chunk_kda
    labels:
      - fused
      - FLA
      - enflame
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_chunk_kda.py
    benchmark: benchmark/test_chunk_kda.py
  - id: flash_attention
    description: Run FlashAttention forward, including its auxiliary-output path.
    for:
      - flash_attention
    labels:
      - fused
      - Attention
      - FlashAttention
      - NoCPU
    kind:
      - Attention
    stages:
      - stable: '0.2'
    tests:
      - tests/flag_attn/test_flash_attention.py::test_attention_fwd
      - tests/flag_attn/test_flash_attention.py::test_attention_with_aux_outs
      - tests/flag_attn/test_flash_attention.py::test_splitkv_large_logits
      - tests/flag_attn/test_flash_attention.py::test_splitkv_independent_kv_strides
    benchmark: benchmark/flash_benchmark.py
  - id: flash_attention_backward
    description: Run the backward path for FlashAttention.
    for:
      - flash_attention
    labels:
      - fused
      - Attention
      - FlashAttention
      - NoCPU
    kind:
      - Attention
    stages:
      - stable: '0.2'
    tests:
      - tests/flag_attn/test_flash_attention.py::test_attention_bwd
  - id: flash_attention_dropout
    description: Run FlashAttention dropout forward, backward, and mask recomputation paths.
    for:
      - flash_attention
    labels:
      - fused
      - Attention
      - FlashAttention
      - dropout
      - NoCPU
    kind:
      - Attention
    stages:
      - stable: '0.2'
    tests:
      - tests/flag_attn/test_flash_attention.py::test_attention_fwd_dropout
      - tests/flag_attn/test_flash_attention.py::test_attention_bwd_dropout
      - tests/flag_attn/test_flash_attention.py::test_attention_bwd_dropout_bfloat16_precision
      - tests/flag_attn/test_dropout.py::test_recompute_mask
  - id: flash_attention_split_kv
    description: Run split-KV FlashAttention for long KV sequences and grouped-query layouts.
    for:
      - flash_attention_split_kv
    labels:
      - fused
      - Attention
      - FlashAttention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_flash_attention.py::test_attention_splitkv
      - tests/flag_attn/test_flash_attention.py::test_splitkv_large_logits
      - tests/flag_attn/test_flash_attention.py::test_splitkv_single_split_preserves_dtype
      - tests/flag_attn/test_flash_attention.py::test_splitkv_independent_kv_strides
    benchmark: benchmark/flash_decoding_benchmark.py
  - id: inkling_fa4_rel_attention
    description: Triton and Hopper TLE paged relative attention with relative-position logits.
    for:
      - inkling_fa4_rel_attention
    labels:
      - KernelGen
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_relative_attention.py
    benchmark: benchmark/test_inkling_fa4_benchmark.py
  - id: minimax_m3_sparse_attn
    description: Run MiniMax M3 sparse attention prefill, decode, and top-k selection.
    for:
      - minimax_m3_sparse_attn
      - minimax_m3_index_topk
      - minimax_m3_index_score
      - minimax_m3_index_decode
      - minimax_m3_index_decode_score
      - minimax_m3_sparse_attn_decode
    labels:
      - fused
      - Attention
      - MiniMax
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: unreleased
    tests:
      - tests/flag_attn/test_minimax_sparse_attention.py::test_prefill_topk_streaming_partial_tile_excludes_padding
      - tests/flag_attn/test_minimax_sparse_attention.py::test_prefill_topk_radix_path
      - tests/flag_attn/test_minimax_sparse_attention.py::test_public_exports_use_active_backend
      - tests/flag_attn/test_minimax_sparse_attention.py::test_metax_public_exports
      - tests/flag_attn/test_minimax_sparse_attention.py::test_prefill_bf16
      - tests/flag_attn/test_minimax_sparse_attention.py::test_prefill_fp8
      - tests/flag_attn/test_minimax_sparse_attention.py::test_decode_bf16
      - tests/flag_attn/test_minimax_sparse_attention.py::test_decode_topk_selection_bf16
      - tests/flag_attn/test_minimax_sparse_attention.py::test_decode_topk_k16_bf16
      - tests/flag_attn/test_minimax_sparse_attention.py::test_decode_topk_identity_out_and_score_out_bf16
      - tests/flag_attn/test_minimax_sparse_attention.py::test_decode_fp8
      - tests/flag_attn/test_ascend_attention.py::test_minimax_prefill_stage_and_index
    benchmark: benchmark/test_minimax_sparse_attention_benchmark.py
  - id: parallel_moba
    description: Run variable-length parallel MoBA attention.
    for:
      - parallel_moba
    labels:
      - fused
      - FLA
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_moba.py
    benchmark: benchmark/test_moba_perf.py
  - id: paged_attention
    description: Run paged KV-cache attention with automatic, explicit, and targeted split selection.
    for:
      - paged_attention
    labels:
      - fused
      - Attention
      - vLLM
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_paged_attention.py::test_paged_attention_default
      - tests/flag_attn/test_paged_attention.py::test_paged_attention_by_num_splits
      - tests/flag_attn/test_paged_attention.py::test_paged_attention_by_case
    benchmark: benchmark/paged_benchmark.py
  - id: parallel_nsa
    description: Run native sparse attention selection, compression, and full pipeline on the selected backend.
    for:
      - parallel_nsa
      - parallel_nsa_compression
    labels:
      - fused
      - FLA
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: unreleased
    tests:
      - tests/flag_attn/test_parallel_nsa.py
      - tests/flag_attn/test_parallel_nsa_compression.py
    benchmark: benchmark/test_parallel_nsa_benchmark.py
  - id: piecewise_attention
    description: Run the forward path for piecewise attention.
    for:
      - piecewise_attention
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - stable: '0.2'
    tests:
      - tests/flag_attn/test_piecewise_attention.py::test_attention_fwd
    benchmark: benchmark/piecewise_benchmark.py
  - id: piecewise_attention_backward
    description: Run the backward path for piecewise attention.
    for:
      - piecewise_attention
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - stable: '0.2'
    tests:
      - tests/flag_attn/test_piecewise_attention.py::test_attention_bwd
  - id: runtime
    description: Validate public device metadata and backend selection.
    for:
      - runtime
    labels:
      - runtime
    kind:
      - Runtime
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_runtime.py
      - tests/flag_attn/test_test_runner.py
  - id: sage_attention
    description: Run SageAttention quantization, masking, layouts, and argument validation.
    for:
      - sage_attention
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_sage_attention.py
    benchmark: benchmark/test_sage_attention_benchmark.py
  - id: fused_attnres
    description: Run fused attention residual aggregation.
    for:
      - fused_attnres
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_attnres.py
    benchmark: benchmark/test_fused_attnres_benchmark.py
  - id: parallel_forgetting_attn
    description: Run ACP-enabled forgetting attention.
    for:
      - parallel_forgetting_attn
      - forgetting_attention
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_forgetting_attention.py
    benchmark: benchmark/test_forgetting_attention_benchmark.py
  - id: parallel_parallax
    description: Run Parallax fixed-length and variable-length prefill, backward, and KV-cache decode.
    for:
      - parallel_parallax
      - parallax_decode
      - parallax_attn_with_kvcache
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: unreleased
    tests:
      - tests/flag_attn/test_parallax.py
      - tests/flag_attn/test_parallax_decode.py
    benchmark:
      - benchmark/test_parallax_benchmark.py
      - benchmark/test_parallax_decode_benchmark.py
  - id: log_linear_attn
    description: Run chunked log-linear attention.
    for:
      - log_linear_attn
      - chunk_log_linear_attn
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_log_linear_attn.py
    benchmark: benchmark/test_log_linear_attn_benchmark.py
  - id: diffkv_attention
    description: Run paged DiffKV attention.
    for:
      - diffkv_attention
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: 'unreleased'
    tests:
      - tests/flag_attn/test_diffkv_attention.py
    benchmark: benchmark/test_diffkv_attention_benchmark.py
  - id: infllmv2_attention
    description: Run InfLLM-V2 prefill, sparse backward, and variable-length decode.
    for:
      - infllmv2_attention
      - infllmv2_decode
    labels:
      - fused
      - Attention
      - NoCPU
    kind:
      - Attention
    stages:
      - alpha: unreleased
    tests:
      - tests/flag_attn/test_infllmv2_attention.py::test_selector_pipeline_matches_reference
      - tests/flag_attn/test_infllmv2_attention.py::test_attention_full_prefix_chunk_varlen
      - tests/flag_attn/test_infllmv2_attention.py::test_attention_dense_path
      - tests/flag_attn/test_infllmv2_attention.py::test_attention_sparse_backward
      - tests/flag_attn/test_infllmv2_attention.py::test_wide_topk_tle_or_standard_matches_streaming
      - tests/flag_attn/test_infllmv2_attention.py::test_tle_stage1_matches_standard_when_available
      - tests/flag_attn/test_infllmv2_attention.py::test_tle_stage2_matches_standard_when_available
      - tests/flag_attn/test_infllmv2_attention.py::test_d64_tle_stage1_dispatch_and_standard_fallback
      - tests/flag_attn/test_infllmv2_attention.py::test_invalid_attention_input_is_rejected
      - tests/flag_attn/test_infllmv2_attention.py::test_decode_varlen_matches_reference
      - tests/flag_attn/test_infllmv2_attention.py::test_invalid_decode_batch_is_rejected
    benchmark: benchmark/test_infllmv2_attention_benchmark.py
