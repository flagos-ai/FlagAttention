name: Build Debian Packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    # Only what changes the package. A .deb or .rpm built on a source
    # PR is published nowhere and downloaded by no one; release tags
    # above still build, and a build can be requested by hand.
    paths:
      - 'packaging/debian/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .deb
        run: bash packaging/debian/build-helpers/build-flag-attention.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flag-attention-amd64-packages
          path: debian-packages/*.deb
          retention-days: 7
